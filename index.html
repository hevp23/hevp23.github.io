/* Contenedor para alinear la foto y el botón */

/* --- BOTÓN TRADUCTOR FIJO Y CON SU CÍRCULO BLANCO --- */
.idioma-flotante-izq {
  position: absolute;   
  left: 35px;           
  top: 200px;           
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.idioma-boton {
  display: flex;
  align-items: center;
  justify-content: center;
  background: white !important; /* Forzamos el fondo blanco */
  border: 2px solid #ccc;
  border-radius: 50%;
  width: 45px;
  height: 45px;
  font-size: 24px;
  cursor: pointer;
  box-shadow: 0px 4px 8px rgba(0,0,0,0.15);
  user-select: none;
}

.texto-idioma-actual {
  font-size: 11px;
  font-weight: bold;
  color: #ffe000;
  background-color: rgba(0, 0, 0, 0.4);
  padding: 2px 6px;
  border-radius: 6px;
  margin-top: 4px;
  text-align: center;
  white-space: nowrap;
}

/* Ocultamos el menú desplegable viejo para que funcione al toque */
.opciones-idioma {
  display: none !important;
}


/* --- NUEVA CUADRÍCULA DE ENLACES DESDE CERO --- */
.cuadricula-enlaces {
  display: grid !important;
  grid-template-columns: repeat(2, minmax(0, 1fr)) !important; 
  gap: 12px !important;                      
  width: 90% !important;                     
  max-width: 440px !important;               
  margin: 20px auto !important;      
  justify-content: center !important;        
  justify-items: center !important;  
}

/* --- NUEVOS BOTONES LIMPIOS Y CENTRADOS --- */
.boton-enlace {
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;   
  background-color: #00ff16 !important;      
  color: #ff4200 !important;                 
  text-decoration: none !important;          
  padding: 15px 10px !important;             
  border-radius: 15px !important;            
  font-weight: bold !important;              
  width: 100% !important;                    
  box-sizing: border-box !important;         
  text-align: center !important;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  transition: background-color 0.3s ease;
}

.boton-enlace:hover {
  background-color: rgba(255, 255, 255, 0.3);
}

.boton-enlace span {
  color: #ff4200 !important;      
  text-decoration: none !important;
  text-align: center !important;
  width: 100% !important;
  font-size: 15px;
}

/* --- ESTILO PARA EL ICONO FUTURO DENTRO DEL BOTÓN --- */
.icono-enlace {
  width: 24px !important;
  height: 24px !important;
  min-width: 24px !important;             
  border-radius: 50% !important;          
  margin-right: 8px !important;
  object-fit: cover !important;
}

/* Si la etiqueta de imagen está vacía, se oculta solita para que el texto quede centrado */
.icono-enlace:not([src]), 
.icono-enlace[src=""],
.icono-enlace[src="#"] {
  display: none !important;         
}

/* --- LOGO Y NOMBRE DE LA WEB (Chiquito, redondo y a la par) --- */
.marca-web-contenedor {
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 10px !important;
  margin: 15px auto !important;

.logo-web {

.texto-web {
  font-size: 1.2rem !important;
  font-weight: bold !important;
  color: #ffe000 !important;
  text-decoration: none !important;

/* --- BOTÓN DE MÚSICA FLOTANTE (AL OTRO LADO) --- */
.musica-flotante-der {

<script>
  let idiomaActual = 'es';

  function actualizarReloj() {
    const ahora = new Date();
    let fechaTexto = "";

    if (idiomaActual === 'es') {
      const opcionesFecha = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
      fechaTexto = ahora.toLocaleDateString('es-ES', opcionesFecha);
      
      let palabras = fechaTexto.split(' ');
      palabras[0] = palabras[0].charAt(0).toUpperCase() + palabras[0].slice(1);
      if (palabras[3]) {
        palabras[3] = palabras[3].charAt(0).toUpperCase() + palabras[3].slice(1);
      }
      fechaTexto = palabras.join(' ');
    } else {
      const opcionesFecha = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
      fechaTexto = ahora.toLocaleDateString('en-US', opcionesFecha);
    }

    let horas = ahora.getHours();
    const minutos = String(ahora.getMinutes()).padStart(2, '0');
    const segundos = String(ahora.getSeconds()).padStart(2, '0');
    const ampm = horas >= 12 ? 'PM' : 'AM';

    horas = horas % 12;
    horas = horas ? horas : 12;

    const horaTexto = `${horas}:${minutos}:${segundos} ${ampm}`;

    const elementoFecha = document.getElementById('fecha-actual');
    const elementoReloj = document.getElementById('reloj-actual');

    if (elementoFecha) elementoFecha.textContent = fechaTexto;
    if (elementoReloj) elementoReloj.textContent = horaTexto;
  }

  // Arranca el reloj y el intervalo de inmediato
  actualizarReloj();
  setInterval(actualizarReloj, 1000);

  // --- CONTROLADOR DE IDIOMA CON UN SOLO TOQUE ---
  function alternarIdioma() {
    if (idiomaActual === 'es') {
      idiomaActual = 'en';
      const btnIdioma = document.getElementById('btn-idioma');
      const lblIdioma = document.getElementById('lbl-idioma-activo');
      if (btnIdioma) btnIdioma.innerText = '🇬🇧';
      if (lblIdioma) lblIdioma.innerText = 'English';
    } else {
      idiomaActual = 'es';
      const btnIdioma = document.getElementById('btn-idioma');
      const lblIdioma = document.getElementById('lbl-idioma-activo');
      if (btnIdioma) btnIdioma.innerText = '🇪🇸';
      if (lblIdioma) lblIdioma.innerText = 'Español';
    }

    actualizarReloj();
    actualizarTextosBotones();

    // Actualizar texto del botón de música según el idioma actual
    const audio = document.getElementById('audio-fondo');
    const lblMusica = document.getElementById('lbl-musica-activo');
    if (lblMusica && audio) {
      if (idiomaActual === 'es') {
        lblMusica.textContent = audio.paused ? 'Reproducir' : 'Pausa';
      } else {
        lblMusica.textContent = audio.paused ? 'Play' : 'Pause';
      }
    }
  }

  // --- FUNCIÓN PARA ACTUALIZAR LOS TEXTOS DE LOS BOTONES ---
  function actualizarTextosBotones() {
    const elementos = {
      comunidad: document.getElementById('txt-comunidad'),
      redes: document.getElementById('txt-redes'),
      tecnologia: document.getElementById('txt-tecnologia'),
      educacion: document.getElementById('txt-educacion'),
      deportes: document.getElementById('txt-deportes'),
      economia: document.getElementById('txt-economia'),
      mapas: document.getElementById('txt-mapas'),
      carrd: document.getElementById('txt-carrd'),
      juegos: document.getElementById('txt-juegos'),
      fabbio: document.getElementById('txt-fabbio'),
      milkshake: document.getElementById('txt-milkshake'),
      inbio: document.getElementById('txt-inbio'),
      ibio: document.getElementById('txt-ibio'),
      linkhub: document.getElementById('txt-linkhub')
    };

    if (idiomaActual === 'es') {
      if(elementos.comunidad) elementos.comunidad.innerText = "Comunidad";
      if(elementos.redes) elementos.redes.innerText = "Redes Sociales";
      if(elementos.tecnologia) elementos.tecnologia.innerText = "Tecnología";
      if(elementos.educacion) elementos.educacion.innerText = "Educación";
      if(elementos.deportes) elementos.deportes.innerText = "Deportes";
      if(elementos.economia) elementos.economia.innerText = "Economía";
      if(elementos.mapas) elementos.mapas.innerText = "Mapas";
      if(elementos.carrd) elementos.carrd.innerText = "Carrd";
      if(elementos.juegos) elementos.juegos.innerText = "Juegos";
      if(elementos.fabbio) elementos.fabbio.innerText = "Fab Bio";
      if(elementos.milkshake) elementos.milkshake.innerText = "Milkshake";
      if(elementos.inbio) elementos.inbio.innerText = "Inbio";
      if(elementos.ibio) elementos.ibio.innerText = "iBio";
      if(elementos.linkhub) elementos.linkhub.innerText = "Linkhub";
    } else {
      if(elementos.comunidad) elementos.comunidad.innerText = "Community";
      if(elementos.redes) elementos.redes.innerText = "Social Media";
      if(elementos.tecnologia) elementos.tecnologia.innerText = "Technology";
      if(elementos.educacion) elementos.educacion.innerText = "Education";
      if(elementos.deportes) elementos.deportes.innerText = "Sports";
      if(elementos.economia) elementos.economia.innerText = "Economy";
      if(elementos.mapas) elementos.mapas.innerText = "Maps";
      if(elementos.carrd) elementos.carrd.innerText = "Carrd";
      if(elementos.juegos) elementos.juegos.innerText = "Games";
      if(elementos.fabbio) elementos.fabbio.innerText = "Fab Bio";
      if(elementos.milkshake) elementos.milkshake.innerText = "Milkshake";
      if(elementos.inbio) elementos.inbio.innerText = "Inbio";
      if(elementos.ibio) elementos.ibio.innerText = "iBio";
      if(elementos.linkhub) elementos.linkhub.innerText = "Linkhub";
    }
  }

  // --- CONTROLADOR DE MÚSICA CON ETIQUETA DINÁMICA ---
  function toggleMusica() {
    const audio = document.getElementById('audio-fondo');
    const btnMusica = document.getElementById('btn-musica');
    const lblMusica = document.getElementById('lbl-musica-activo');

    if (audio && btnMusica && lblMusica) {
      if (audio.paused) {
        audio.play();
        btnMusica.textContent = '⏸️';
        if (idiomaActual === 'es') {
          lblMusica.textContent = 'Pausa';
        } else {
          lblMusica.textContent = 'Pause';
        }
      } else {
        audio.pause();
        btnMusica.textContent = '▶️';
        if (idiomaActual === 'es') {
          lblMusica.textContent = 'Reproducir';
        } else {
          lblMusica.textContent = 'Play';
        }
      }
    }
  }
</script>
